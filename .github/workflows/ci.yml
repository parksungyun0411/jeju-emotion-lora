name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: test
        # torch가 없으므로 스모크 학습 테스트는 건너뛴다. 원 저장소 대조 테스트도 디스크에 없어 건너뛴다.
        run: pytest -q -rs
