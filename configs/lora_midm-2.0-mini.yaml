# LoRA r=16, 학습 데이터 100%, 1 epoch. 랭크 비교·데이터 효율 곡선은 이번 범위에서 뺐다.
model: midm-2.0-mini
input_mode: jeju
seed: 42
output_dir: outputs/lora/midm-2.0-mini
# 공식 템플릿을 두 군데 고친 템플릿을 학습·병합본에 쓴다 (docs/colab_t4.md): 기본 시스템 문구(약 460토큰)
# 때문에 max_length 256에서 정답이 모두 잘리고, 답 끝 토큰(<|eot_id|>)이 모델이 실제로 내는
# <|end_of_text|>와 달라 손실이 그 토큰에 묶인다
chat_template: configs/chat_templates/midm-2.0-mini.jinja
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
train:
  epochs: 1
  learning_rate: 2.0e-4
  per_device_batch_size: 32
  grad_accum: 1
  warmup_ratio: 0.03
  lr_scheduler: cosine
  max_length: 256
  max_train_samples: null
  max_eval_samples: 2000
  gradient_checkpointing: true
  bf16: true
