# 결과 표의 행. 각 행은 reports/metrics/{metrics}.json, reports/throughput/{throughput}.json을 읽는다.
# 파일이 없으면 그 칸은 '측정 전'으로 남고, not_run: 사유가 있으면 '측정 안 함'과 사유가 나온다.
# 분할·정밀도·백엔드 열은 각 파일에 기록된 값이다(2026-10-15 Colab T4 실행은 문장 단위 분할, fp16).
# 2026-10-16부터는 Kaggle 무료 T4에서 잰다(docs/kaggle_t4.md).
rows:
  # 원 프로젝트 인코더 코드를 문장 단위 분할로 다시 학습한 값 (python -m jeju_lora.encoder_eval)
  - name: Dual-Gated KR-BERT (원 코드)
    metrics: encoder_dual_sentence
  - name: KoELECTRA (원 코드)
    metrics: encoder_koelectra_sentence
  - name: KoELECTRA + Dual KR-BERT 앙상블 (원 코드)
    metrics: encoder_ensemble
    throughput: encoder_ensemble
  - name: kanana-1.5-2.1b 제로샷
    metrics: zeroshot_kanana-1.5-2.1b
  - name: kanana-1.5-2.1b 퓨샷 (클래스당 1)
    metrics: fewshot_kanana-1.5-2.1b
  - name: kanana-1.5-2.1b LoRA 병합
    metrics: lora_kanana-1.5-2.1b_fp16
    throughput: lora_kanana-1.5-2.1b_fp16
  - name: kanana-1.5-2.1b LoRA AWQ 4bit
    metrics: lora_kanana-1.5-2.1b_awq
    throughput: lora_kanana-1.5-2.1b_awq
  - name: Qwen3-4B 제로샷
    metrics: zeroshot_qwen3-4b
  - name: Qwen3-4B 퓨샷 (클래스당 1)
    metrics: fewshot_qwen3-4b
  - name: Qwen3-4B LoRA 병합
    metrics: lora_qwen3-4b_fp16
    throughput: lora_qwen3-4b_fp16
  # fp16 보정이 마지막 층 오차 계산에서 넘쳐 fp32로 보정했다 (reports/diagnostics/qwen3_fp16.md)
  - name: Qwen3-4B LoRA AWQ 4bit (fp32 보정)
    metrics: lora_qwen3-4b_awq
    throughput: lora_qwen3-4b_awq
  - name: Midm-2.0-Mini 제로샷
    metrics: zeroshot_midm-2.0-mini
  - name: Midm-2.0-Mini 퓨샷 (클래스당 1)
    metrics: fewshot_midm-2.0-mini
  # LoRA와 같은 템플릿(configs/chat_templates/midm-2.0-mini.jinja)으로 잰 기준선
  - name: Midm-2.0-Mini 제로샷 (LoRA용 템플릿)
    metrics: zeroshot_midm-2.0-mini_tpl
  - name: Midm-2.0-Mini 퓨샷 (LoRA용 템플릿)
    metrics: fewshot_midm-2.0-mini_tpl
  - name: Midm-2.0-Mini LoRA 병합
    metrics: lora_midm-2.0-mini_fp16
    throughput: lora_midm-2.0-mini_fp16
  - name: Midm-2.0-Mini LoRA AWQ 4bit
    metrics: lora_midm-2.0-mini_awq
    throughput: lora_midm-2.0-mini_awq
  # 원 행 단위 분할(test 행 70.4%가 train과 같은 문장)로 원 코드를 다시 돌린 값. 위 행들과 분할이 달라 비교하지 않는다.
  # train에 있는 문장과 없는 문장을 나눈 값은 reports/diagnostics/row_split_seen_unseen.md
  # 재라벨 277건은 문장 단위 분할 test에서 뽑아 이 분할과 맞지 않으므로 그 열은 비운다(no_human).
  - name: Dual-Gated KR-BERT (원 코드, 원 행 단위 분할)
    metrics: encoder_dual_row
    no_human: true
  - name: KoELECTRA (원 코드, 원 행 단위 분할)
    metrics: encoder_koelectra_row
    no_human: true
  - name: KoELECTRA + Dual KR-BERT 앙상블 (원 코드, 원 행 단위 분할)
    metrics: encoder_ensemble_row
    no_human: true
